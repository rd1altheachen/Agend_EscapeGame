<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>2D Scene POC</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#111;font-family:sans-serif;overflow:hidden}
#app{display:flex;flex-direction:column;align-items:center;height:100dvh;width:100%}
#scene-wrap{position:relative;width:100%;max-width:390px;aspect-ratio:390/550;background:#000;overflow:hidden;flex-shrink:0}
#scene-wrap img{width:100%;height:100%;object-fit:cover;display:block}
.placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#999;font-size:24px;background:#fff}
/* Hotspots - no hover effect */
.hotspot{position:absolute;cursor:pointer;border:none;background:transparent;z-index:5}
/* Circular nav hitboxes */
.nav-circle{position:absolute;bottom:10%;width:12%;aspect-ratio:1;border-radius:50%;cursor:pointer;z-index:10;border:2px solid transparent;transition:border-color .3s,box-shadow .3s}
.nav-circle.flash{border-color:rgba(255,255,255,.8);box-shadow:0 0 12px rgba(255,255,255,.6)}
.nav-circle-l{left:8%}
.nav-circle-r{right:8%}
/* Dialogue box */
#dialogue{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.75);color:#fff;padding:12px;font-size:14px;line-height:1.5;z-index:50;cursor:pointer;display:none}
/* Closeup overlay */
#closeup{position:absolute;inset:0;background:#000;z-index:40;display:none;flex-direction:column;align-items:center;justify-content:center}
#closeup.active{display:flex}
#closeup img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.closeup-back{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);padding:8px 24px;background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:20px;cursor:pointer;z-index:45;font-size:14px}
/* Keyhole diamond hitboxes */
.keyhole{position:absolute;width:10%;aspect-ratio:1;transform:rotate(45deg);cursor:pointer;border:2px solid rgba(255,215,0,.3);z-index:45}
/* Orrery closeup */
.orrery-slot{position:absolute;display:flex;flex-direction:column;align-items:center;z-index:45}
.orrery-placeholder{width:80px;height:80px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;font-weight:bold;text-align:center}
.orrery-btn{width:32px;height:32px;border-radius:50%;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.1);color:#fff;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;margin:4px 0}
/* Inventory */
#inventory{display:flex;width:100%;max-width:390px;background:#1a1a2e;border-top:2px solid #ffd700;padding:6px 8px;justify-content:center;gap:6px}
.inv-slot{width:42px;height:42px;border:2px dashed rgba(255,215,0,.3);border-radius:8px}
/* Toolbar */
#toolbar{display:flex;width:100%;max-width:390px;background:#0d0d1a;padding:6px 8px;justify-content:center;gap:8px;flex-wrap:wrap}
#toolbar button{padding:8px 16px;border:none;border-radius:16px;background:rgba(255,255,255,.1);color:#fff;font-size:14px;cursor:pointer}
#toolbar button.active{background:rgba(255,215,0,.3);border:1px solid #ffd700}
#toolbar button:hover{background:rgba(255,255,255,.2)}
/* Debug panel */
#debug-panel{display:none;position:fixed;top:10px;right:10px;background:rgba(0,0,0,.9);color:#0f0;padding:12px;border-radius:8px;font-size:12px;z-index:999;max-height:80vh;overflow-y:auto}
#debug-panel label{display:block;margin:4px 0;cursor:pointer}
#debug-panel input[type=checkbox]{margin-right:6px}
/* Key animation */
@keyframes flyIn{from{transform:translate(-50%,-200%) scale(1.5);opacity:1}to{transform:translate(-50%,-50%) scale(.5);opacity:0}}
@keyframes goldGlow{0%{box-shadow:0 0 0 rgba(255,215,0,0)}50%{box-shadow:0 0 40px rgba(255,215,0,.8)}100%{box-shadow:0 0 0 rgba(255,215,0,0)}}
@keyframes fadeOut{from{opacity:1}to{opacity:0}}
</style>
</head>
<body>
<div id="app">
  <div id="scene-wrap">
    <div id="scene-content"></div>
    <div id="closeup"></div>
    <div id="dialogue" onclick="hideDialogue()"></div>
  </div>
  <div id="inventory">
    <div class="inv-slot"></div><div class="inv-slot"></div><div class="inv-slot"></div>
    <div class="inv-slot"></div><div class="inv-slot"></div><div class="inv-slot"></div>
  </div>
  <div id="toolbar">
    <button id="btn-r1" class="active" onclick="switchRoom(1)">⭐ 房間1</button>
    <button id="btn-r2" onclick="switchRoom(2)">🧪 房間2</button>
    <button onclick="console.log('提示')">💡 提示</button>
    <button onclick="toggleDebug()">🔧</button>
  </div>
</div>
<div id="debug-panel">
  <strong>Debug Panel</strong><hr style="border-color:#333;margin:6px 0">
  <div id="debug-flags"></div>
  <button onclick="gameState.inventory.push('crystal_key');renderDebug()" style="margin-top:8px;padding:4px 8px;font-size:11px">+水晶鑰匙</button>
  <button onclick="gameState.inventory.push('magic_weight');renderDebug()" style="margin-top:4px;padding:4px 8px;font-size:11px">+魔法砝碼</button>
</div>
<script>
const VIEWS=['north','east','south','west'];
const LABELS={north:'北牆',east:'東牆',south:'南牆',west:'西牆'};
let currentRoom=1,viewIdx=1; // start on east wall for testing
let orreryFirstClick=true; // track if orrery text has been shown

const gameState={
  inventory:[],
  hasStarChart:false,
  hasMusicBoxClue:false,
  hasCarpetClue:false,
  hasSpellClue:false,
  doorOpen:false,
};

// Orrery puzzle state
const CONSTELLATIONS=['紅獅子','藍獅子','藍水瓶','金水瓶','金天秤','紅天秤'];
const CONSTELLATION_COLORS={紅獅子:'#c0392b',藍獅子:'#2980b9',藍水瓶:'#3498db',金水瓶:'#f39c12',金天秤:'#f1c40f',紅天秤:'#e74c3c'};
let orrerySlots=[0,0,0]; // indices into CONSTELLATIONS

function showDialogue(text){
  const d=document.getElementById('dialogue');
  d.textContent=text;
  d.style.display='block';
}
function hideDialogue(){document.getElementById('dialogue').style.display='none';}

function render(){
  const el=document.getElementById('scene-content');
  const view=VIEWS[viewIdx];
  document.getElementById('closeup').classList.remove('active');
  document.getElementById('closeup').innerHTML='';
  if(currentRoom===1&&view==='east'){
    el.innerHTML=`<img src="assets/scene-room1-east.png" alt="東牆">
      <div class="hotspot" style="top:28%;left:5%;width:32%;height:42%" onclick="clickOrrery()"></div>
      <div class="hotspot" style="top:12%;left:55%;width:38%;height:75%" onclick="clickDoor()"></div>
      <div class="nav-circle nav-circle-l" onclick="navFlash(this,-1)"></div>
      <div class="nav-circle nav-circle-r" onclick="navFlash(this,1)"></div>`;
  } else {
    const room=currentRoom===1?'房間1':'房間2';
    el.innerHTML=`<div class="placeholder">${room} — ${LABELS[view]}</div>
      <div class="nav-circle nav-circle-l" onclick="navFlash(this,-1)"></div>
      <div class="nav-circle nav-circle-r" onclick="navFlash(this,1)"></div>`;
  }
}

function navFlash(el,dir){
  el.classList.add('flash');
  setTimeout(()=>{el.classList.remove('flash');rotate(dir);},300);
}

function rotate(d){viewIdx=(viewIdx+d+4)%4;render();}
function switchRoom(r){
  currentRoom=r;viewIdx=0;render();
  document.getElementById('btn-r1').classList.toggle('active',r===1);
  document.getElementById('btn-r2').classList.toggle('active',r===2);
}

// --- Door interaction ---
function clickDoor(){
  showKeyholeCloseup();
}

function showKeyholeCloseup(){
  const c=document.getElementById('closeup');
  c.classList.add('active');
  // Use the east wall image cropped to keyhole area via object-position
  c.innerHTML=`
    <img src="assets/scene-room1-east.png" style="object-fit:cover;object-position:60% 45%;transform:scale(2.5)">
    <div class="keyhole" style="top:38%;left:28%" onclick="clickKeyhole('left')"></div>
    <div class="keyhole" style="top:38%;left:46%" onclick="clickKeyhole('middle')"></div>
    <div class="keyhole" style="top:38%;left:64%" onclick="clickKeyhole('right')"></div>
    <div class="closeup-back" onclick="closeCloseup()">返回</div>`;
}

function clickKeyhole(pos){
  const hasKey=gameState.inventory.includes('crystal_key');
  if(!hasKey){showDialogue('沒有鑰匙');return;}
  if(!gameState.hasCarpetClue||!gameState.hasSpellClue){showDialogue('好像還缺什麼東西');return;}
  if(pos!=='middle')return; // wrong hole - no response
  // Correct! Animate key insertion
  animateDoorOpen();
}

function animateDoorOpen(){
  const c=document.getElementById('closeup');
  // Key fly-in animation
  const key=document.createElement('div');
  key.style.cssText='position:absolute;top:50%;left:50%;width:30px;height:30px;background:#ffd700;border-radius:4px;z-index:46;animation:flyIn .5s forwards';
  c.appendChild(key);
  setTimeout(()=>{
    // Gold glow
    c.style.animation='goldGlow .5s';
    setTimeout(()=>{
      // Fade out and switch room
      c.style.animation='fadeOut .5s forwards';
      setTimeout(()=>{
        gameState.doorOpen=true;
        c.style.animation='';
        c.classList.remove('active');
        c.innerHTML='';
        switchRoom(2);
      },500);
    },500);
  },500);
}

// --- Orrery interaction ---
function clickOrrery(){
  if(orreryFirstClick){
    orreryFirstClick=false;
    showDialogue('一個古老的星座儀，球面上刻著星座圖案…似乎可以轉動。');
    return;
  }
  showOrreryCloseup();
}

function showOrreryCloseup(){
  const c=document.getElementById('closeup');
  c.classList.add('active');
  c.innerHTML=`
    <img src="assets/scene-room1-east.png" style="object-fit:cover;object-position:20% 40%;transform:scale(2.8)">
    <div class="orrery-slot" style="top:20%;left:15%" id="os0"></div>
    <div class="orrery-slot" style="top:20%;left:42%" id="os1"></div>
    <div class="orrery-slot" style="top:20%;left:69%" id="os2"></div>
    <div class="closeup-back" onclick="closeCloseup()">返回</div>`;
  renderOrrerySlots();
}

function renderOrrerySlots(){
  for(let i=0;i<3;i++){
    const el=document.getElementById('os'+i);
    if(!el)return;
    const name=CONSTELLATIONS[orrerySlots[i]];
    const color=CONSTELLATION_COLORS[name];
    el.innerHTML=`
      <div class="orrery-btn" onclick="cycleOrrery(${i},-1)">▲</div>
      <div class="orrery-placeholder" style="background:${color}">${name}</div>
      <div class="orrery-btn" onclick="cycleOrrery(${i},1)">▼</div>`;
  }
}

function cycleOrrery(slot,dir){
  orrerySlots[slot]=(orrerySlots[slot]+dir+6)%6;
  renderOrrerySlots();
  checkOrreryAnswer();
}

function checkOrreryAnswer(){
  // Correct: 紅獅子(0), 藍水瓶(2), 金天秤(4)
  const correct=orrerySlots[0]===0&&orrerySlots[1]===2&&orrerySlots[2]===4;
  if(!correct)return;
  if(!gameState.hasStarChart||!gameState.hasMusicBoxClue){
    showDialogue('好像還缺什麼東西');
    return;
  }
  // Success!
  showDialogue('星座儀發出柔和的光芒…你獲得了魔法砝碼！');
  if(!gameState.inventory.includes('magic_weight')){
    gameState.inventory.push('magic_weight');
  }
  setTimeout(()=>closeCloseup(),1500);
}

function closeCloseup(){
  const c=document.getElementById('closeup');
  c.classList.remove('active');
  c.innerHTML='';
}

// --- Debug ---
function toggleDebug(){
  const p=document.getElementById('debug-panel');
  p.style.display=p.style.display==='none'?'block':'none';
  renderDebug();
}

function renderDebug(){
  const flags=['hasStarChart','hasMusicBoxClue','hasCarpetClue','hasSpellClue','doorOpen'];
  const el=document.getElementById('debug-flags');
  el.innerHTML=flags.map(f=>`<label><input type="checkbox" ${gameState[f]?'checked':''} onchange="gameState['${f}']=this.checked">${f}</label>`).join('')
    +`<p style="margin-top:8px;color:#aaa">inventory: ${JSON.stringify(gameState.inventory)}</p>`;
}

render();
</script>
</body>
</html>
