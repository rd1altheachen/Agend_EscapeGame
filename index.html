<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>密室逃脫 — 星光書房</title>
<link rel="stylesheet" href="styles/main.css">
</head>
<body>
<div id="app">
  <div id="scene-wrap">
    <div id="scene-content"></div>
    <div id="popup-overlay"></div>
    <div id="dialogue"></div>
  </div>
  <div id="inventory"></div>
  <div id="toolbar">
    <button id="btn-r1" class="active" onclick="switchRoom('room1')">⭐ 房間1</button>
    <button id="btn-r2" onclick="switchRoom('room2')">🧪 房間2</button>
    <button>💡 提示</button>
    <button id="btn-debug">🔧</button>
  </div>
</div>
<div id="debug-panel">
  <strong>Debug Panel</strong><hr style="border-color:#333;margin:6px 0">
  <label><input type="checkbox" id="debug-hitbox">顯示 HitBox</label>
  <hr style="border-color:#333;margin:6px 0">
  <div id="debug-flags"></div>
  <button id="debug-add-key" style="margin-top:8px;padding:4px 8px;font-size:11px">+水晶鑰匙</button>
  <button id="debug-add-weight" style="margin-top:4px;padding:4px 8px;font-size:11px">+魔法砝碼</button>
</div>
<script type="module">
import { initScene } from './engine/scene.js';
import { renderInventory } from './engine/inventory.js';
import { initDebug, setupDebugPanel } from './engine/debug.js';

renderInventory();
initDebug();
setupDebugPanel();
initScene();
</script>
</body>
</html>
